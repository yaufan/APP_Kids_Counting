name: counting_farm
description: "數數小農場：3～5 歲在小農場玩數量的遊戲。"
publish_to: 'none'

# The version (also in lib/app/version.dart and CHANGELOG.md; test/version_test.dart checks they agree).
version: 0.1.1+2

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.5
  go_router: ^18.1.1
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/art/animals/
    - assets/art/food/
    - assets/art/farm/
    - assets/art/ui/
  fonts:
    - family: Huninn
      fonts:
        - asset: assets/fonts/jf-openhuninn-2.1.ttf
